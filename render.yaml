# Render Blueprint — Zephyr backend (masterfabric-go + Postgres)
# Dashboard: New > Blueprint > bu repo'yu bağla
# Web URL: https://zephyr-backend-2mtm.onrender.com (Vercel'de NEXT_PUBLIC_BACKEND_URL)

databases:
  - name: zephyr-db
    plan: free
    databaseName: masterfabric
    user: masterfabric

services:
  - type: web
    name: zephyr-backend
    runtime: docker
    repo: https://github.com/texas1881/zephyr-ai-urban-solutions
    branch: develop
    rootDir: backend
    dockerfilePath: deployments/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health/live
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: KAFKA_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        fromDatabase:
          name: zephyr-db
          property: connectionString
